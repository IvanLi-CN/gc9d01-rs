pre-commit:
  parallel: false  # Changed to false to ensure proper order of execution
  commands:
    fmt:
      glob: "*.{rs}"
      run: cargo fmt
      stage_fixed: true
    clippy:
      glob: "*.{rs}"
      run: cargo clippy --all-targets --all-features -- -D warnings
    build-verification:
      run: ./scripts/build-all.sh
      skip:
        - merge
        - rebase
